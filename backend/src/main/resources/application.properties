spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/sportsbuddies
spring.datasource.username=sportsbuddies
spring.datasource.password=sportsbuddies

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=false

jwt.secret=${JWT_SECRET:h63Wue8jqmpQEMdC4ZsKUARFBV7yG2H0walxzfJbY9vIPTir}

server.error.include-message=always
server.error.include-stacktrace=never

# Profile pictures (the browser sends ~100 KB; the server refuses anything over 2 MB)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# lets Tomcat read past a too-large upload so the browser gets the 413 instead of a dropped connection
server.tomcat.max-swallow-size=10MB
